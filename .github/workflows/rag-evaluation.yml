name: rag-evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "evals/**"
      - "backend/app/retrieval/**"
      - ".github/workflows/rag-evaluation.yml"

jobs:
  ragas-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Instalar dependências
        run: uv sync --locked --project backend
      - name: Validar datasets de avaliação
        run: uv run --project backend python evals/runners/validar_datasets.py
      # Semana 3: quando existir o runner do RAGAS, descomente e ajuste a meta.
      # A meta de faithfulness (0.92) já está em backend/app/core/config.py.
      # - name: Benchmark RAGAS
      #   run: uv run --project backend python evals/runners/ragas_runner.py
